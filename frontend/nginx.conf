server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the backend container. The React app
    # only ever calls relative "/api/..." paths (see src/lib/api.js),
    # so this mirrors Vite's dev-server proxy (vite.config.js) exactly
    # — no frontend code differs between `npm run dev` and this
    # container.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: any non-file, non-/api route serves index.html so
    # client-side routing (if added later) doesn't 404 on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}